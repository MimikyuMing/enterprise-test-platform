name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trigger-platform-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
            
      - name: Install requests
        run: pip install requests
              
      - name: Trigger platform execution
        env: 
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          PLATFORM_API_KEY: ${{ secrets.PLATFORM_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          import requests

          base_url = os.environ["PLATFORM_URL"].rstrip("/")
          headers = {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true",
              "X-API-Key": os.environ.get("PLATFORM_API_KEY", ""),
          }

          resp = requests.post(
            f"{base_url}/executions",
            json={"total_cases": 22} 
          )

          print(f"status_code={resp.status_code}")
          print(f"body={resp.text}")
          resp.raise_for_status()

          data = resp.json()
          execution_id = data["id"]
          print(f"execution_id={execution_id}")

          with open("execution_id.txt", "w") as f:
              f.write(str(execution_id))
          EOF
              
      - name: Upload execution_id
        uses: actions/upload-artifact@v4
        with:
          name: execution-id
          path: execution_id.txt

      - name: Wait for execution result
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          PLATFORM_API_KEY: ${{ secrets.PLATFORM_API_KEY }}
        run: |
          python - <<'EOF'
          import json
          import os
          import sys
          import time

          import requests

          base_url = os.environ.get("PLATFORM_URL", "").rstrip("/")
          if not base_url:
              raise SystemExit("PLATFORM_URL is empty. Check GitHub Secrets.")

          headers = {
              "ngrok-skip-browser-warning": "true",
              "X-API-Key": os.environ.get("PLATFORM_API_KEY", ""),
          }

          with open("execution_id.txt") as f:
              execution_id = int(f.read().strip())

          print(f"Polling execution {execution_id} ...")

          max_wait = 300
          interval = 1
          max_interval = 15
          start = time.time()

          while True:
              try:
                  resp = requests.get(
                      f"{base_url}/executions/{execution_id}",
                      headers=headers,
                      timeout=30,
                  )
                  resp.raise_for_status()
                  data = resp.json()
              except requests.RequestException as e:
                  print(f"[{int(time.time() - start)}s] request failed: {e}")
                  time.sleep(interval)
                  interval = min(interval * 2, max_interval)
                  continue

              status = data["status"]
              elapsed = int(time.time() - start)
              print(f"[{elapsed}s] status={status}")

              if status in ("success", "failed", "error"):
                  print(f"Final status: {status}")
                  print(f"passed={data['passed']} failed={data['failed']}")

                  if status != "success":
                      try:
                          cases_resp = requests.get(
                              f"{base_url}/executions/{execution_id}/cases?outcome=failed",
                              headers=headers,
                              timeout=30,
                          )
                          cases_resp.raise_for_status()
                          failed_cases = cases_resp.json().get("items", [])
                          print(f"\nFailed cases ({len(failed_cases)}):")
                          for c in failed_cases:
                              print(f"  - {c['nodeid']}")
                              if c.get("message"):
                                  msg = c["message"].splitlines()[0][:200]
                                  print(f"    {msg}")
                      except requests.RequestException as e:
                          print(f"Failed to fetch case details: {e}")

                  sys.exit(0 if status == "success" else 1)

              if time.time() - start > max_wait:
                  print(f"Timeout after {max_wait}s, last status={status}")
                  sys.exit(1)

              time.sleep(interval)
              interval = min(interval * 2, max_interval)
          EOF