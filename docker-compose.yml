services:
  mysql:
    image: mysql:8.0
    container_name: etp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: etp
      MYSQL_USER: etp_user
      MYSQL_PASSWORD: etp_pass
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: etp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    
  grafana:
    image: grafana/grafana:11.3.0
    container_name: etp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    # depends_on:
    #   - prometheus

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: etp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:
  redis_data:
  grafana_data:
  prometheus_data: