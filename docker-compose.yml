services:
  mysql:
    image: mysql:8.0
    container_name: etp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: etp
      MYSQL_USER: etp_user
      MYSQL_PASSWORD: etp_pass
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: etp-redis
    ports:
      - "7380:6379"
    volumes:
      - redis_data:/data

  api:
    image: enterprise-test-platform:latest
    container_name: etp-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: enterprise-test-platform:latest
    container_name: etp-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env
    ports:
      - "9100:9100"
    volumes:
      - C:/Users/Administrator/Desktop/api-test-framework:/pytest-project
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: etp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:11.3.0
    container_name: etp-grafana
    ports:
      - "3300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data: